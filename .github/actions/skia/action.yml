name: Skia
description: >
  Restores the built Skia tree for this runner image, Skia commit, and version
  of scripts/setup-skia.sh, or builds it with that script and caches it.
  Linux and macOS only (Windows uses scripts/setup-skia.bat in windows-build.yml).

runs:
  using: composite
  steps:
    - name: Skia cache key
      id: key
      shell: bash
      run: |
        commit="$(sed -nE 's/^set\(BUDO_SKIA_DESKTOP_GIT_TAG "([0-9a-f]+)"\)$/\1/p' cmake/BudoDependencyLock.cmake)"
        if [ -z "$commit" ]; then echo "::error::Skia commit not found in the dependency lock"; exit 1; fi
        # ImageOS (e.g. ubuntu22, macos15) keeps builds from different runner
        # images, and so different toolchains and libraries, apart.
        echo "key=skia-${ImageOS:-$RUNNER_OS}-${RUNNER_ARCH}-${commit}-${{ hashFiles('scripts/setup-skia.sh') }}" >> "$GITHUB_OUTPUT"

    # Checkout history, third-party sources, and object files are not needed
    # to build Budo, which keeps the cache around a few hundred MB.
    - name: Restore Skia
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          third_party/skia
          !third_party/skia/.git
          !third_party/skia/third_party/externals
          !third_party/skia/out/Release/obj
        key: ${{ steps.key.outputs.key }}

    - name: Build Skia
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/setup-skia.sh

    # Saved right after building, so a later Budo build failure keeps it.
    - name: Save Skia
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          third_party/skia
          !third_party/skia/.git
          !third_party/skia/third_party/externals
          !third_party/skia/out/Release/obj
        key: ${{ steps.key.outputs.key }}
