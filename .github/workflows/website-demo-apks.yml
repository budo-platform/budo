name: Demos artifacts

on:
  workflow_dispatch:

permissions:
  contents: write # create the release

env:
  RELEASE_TAG: demos-artifacts

jobs:
  bundle:
    name: Build and publish the demos apks
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@main

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Download Budo
        run: |
          curl -fL -o budo https://github.com/budo-platform/budo/releases/latest/download/budo-linux-x86_64
          chmod +x budo
          ./budo version

      # Same NDK as the Android app (ndkVersion in its build.gradle), so the
      # prebuilt Skia libraries match the toolchain that links them.
      - name: Install the Android NDK
        id: ndk
        run: |
          version="27.0.12077973"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$version" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Android NDK $version"

      - name: Build APKs
        run: |
          mkdir -p dist
          ./budo android-apk examples/01_drum_loop_machine -o dist --release
          python3 ./examples/02_desert_racer/download_kenney_car_kit.py
          ./budo android-apk examples/02_desert_racer -o dist --release
          ./budo android-apk examples/03_lua_spaceshooter -o dist --release
          ./budo android-apk examples/06_tetris -o dist --release
          ./budo android-apk examples/07_file_explorer -o dist --release
          ./budo android-apk examples/10_audio_synth -o dist --release
          ./budo android-apk examples/18_llamacpp_chat -o dist --release
          ./budo android-apk examples/19_pong -o dist --release
          ./budo android-apk examples/20_microphone -o dist --release
          ./budo android-apk examples/amstrad-cpc -o dist --release
          ./budo android-apk examples/budo-ui -o dist --release
          ./budo android-apk examples/clock_demo -o dist --release
          ./budo android-apk examples/layout_demo -o dist --release
          ./budo android-apk examples/midi_dumper -o dist --release
          ./budo android-apk examples/midi_preset_saver -o dist --release
          ./budo android-apk examples/network -o dist --release
          ./budo android-apk examples/persistence -o dist --release
          ./budo android-apk examples/sound-instrument -o dist --release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A prerelease that is never "latest": releases/latest/download/...
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
          else
              gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" \
                  --title "Budo demos artifacts $RELEASE_TAG" \
                  --notes "APK files build by CI with latest official Budo release binary" \
                  --prerelease --latest=false
          fi
