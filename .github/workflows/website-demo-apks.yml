name: Demos artifacts

on:
  workflow_dispatch:

permissions:
  contents: write # create the release

env:
  RELEASE_TAG: demos-artifacts

jobs:
  bundle:
    name: Build and publish the demos apks
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@main

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Download Budo
        run: |
          curl -fL -o budo https://github.com/budo-platform/budo/releases/latest/download/budo-linux-x86_64
          chmod +x budo
          ./budo version

      # Same NDK as the Android app (ndkVersion in its build.gradle), so the
      # prebuilt Skia libraries match the toolchain that links them.
      - name: Install the Android NDK
        id: ndk
        run: |
          version="27.0.12077973"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$version" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Android NDK $version"

      - name: Build APKs
        run: |
          mkdir -p dist
          ./budo android-apk examples/01_drum_loop_machine --output-file dist/01_drum_loop_machine.apk --release
          python3 ./examples/02_desert_racer/download_kenney_car_kit.py --force-download
          ./budo android-apk examples/02_desert_racer --output-file dist/02_desert_racer.apk --release
          ./budo android-apk examples/03_lua_spaceshooter --output-file dist/03_lua_spaceshooter.apk --release
          ./budo android-apk examples/06_tetris --output-file dist/06_tetris.apk --release
          ./budo android-apk examples/07_file_explorer --output-file dist/07_file_explorer.apk --release
          ./budo android-apk examples/10_audio_synth --output-file dist/10_audio_synth.apk --release
          ./budo android-apk examples/19_pong --output-file dist/19_pong.apk --release
          ./budo android-apk examples/20_microphone --output-file dist/20_microphone.apk --release
          ./budo android-apk examples/amstrad-cpc --output-file dist/amstrad-cpc.apk --release
          ./budo android-apk examples/budo-ui --output-file dist/budo-ui.apk --release
          ./budo android-apk examples/clock_demo --output-file dist/clock_demo.apk --release
          ./budo android-apk examples/layout_demo --output-file dist/layout_demo.apk --release
          ./budo android-apk examples/midi_dumper --output-file dist/midi_dumper.apk --release
          ./budo android-apk examples/network --output-file dist/network.apk --release
          ./budo android-apk examples/persistence --output-file dist/persistence.apk --release
          ./budo android-apk examples/sound-instrument --output-file dist/sound-instrument.apk --release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A prerelease that is never "latest": releases/latest/download/...
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
          else
              gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" \
                  --title "Budo demos artifacts $RELEASE_TAG" \
                  --notes "APK files build by CI with latest official Budo release binary" \
                  --prerelease --latest=false
          fi
