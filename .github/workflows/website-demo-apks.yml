name: Demos APK

on:
  workflow_dispatch:

permissions:
  contents: write # create the support bundle release

jobs:
  bundle:
    name: Build and publish the demos apks
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Download Budo
        run: |
          curl -fL -o budo https://github.com/budo-platform/budo/releases/latest/download/budo-linux-x86_64
          chmod +x budo
          ./budo version

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
          #sudo apt-get install -y cmake build-essential ninja-build python3 \
          #  libsdl2-dev libfreetype6-dev libfontconfig1-dev libssl-dev zlib1g-dev \
          #  libgl1-mesa-dev

      # Same NDK as the Android app (ndkVersion in its build.gradle), so the
      # prebuilt Skia libraries match the toolchain that links them.
      - name: Install the Android NDK
        id: ndk
        run: |
          version="27.0.12077973"
          if [ -z "$version" ]; then echo "::error::ndkVersion not found in the Android app"; exit 1; fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$version" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Android NDK $version"

      - name: Build APKs
        run: |
          ./budo android-apk examples/01_drum_loop_machine -o ./

