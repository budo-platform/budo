name: Windows build

# Reusable Windows x64 build (MSVC + Ninja), mirroring scripts/windows-build.ps1.
# Produces budo-windows-x86_64.zip: budo.exe plus the DLLs it needs at runtime
# (SDL2, OpenSSL, Wasmtime, the MSVC runtime, ...). Called by makefile.yml (CI) and release.yml.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded artifact holding the zip"
        type: string
        default: budo-windows-x86_64

permissions:
  contents: read

jobs:
  build:
    name: Build budo-windows-x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Read dependency lock
        id: lock
        run: |
          $lock = Get-Content cmake/BudoDependencyLock.cmake -Raw
          function Lock($pattern) {
            $value = [regex]::Match($lock, $pattern).Groups[1].Value
            if (-not $value) { throw "Dependency lock value not found: $pattern" }
            return $value
          }
          "skia=$(Lock 'set\(BUDO_SKIA_DESKTOP_GIT_TAG "([0-9a-f]{40})"\)')" >> $env:GITHUB_OUTPUT
          "quickjs=$(Lock 'set\(BUDO_QUICKJS_IMPL_DEFAULT "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_version=$(Lock 'set\(BUDO_SDL2_WINDOWS_VERSION "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_url=$(Lock 'set\(BUDO_SDL2_WINDOWS_URL\s+"([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_sha256=$(Lock 'set\(BUDO_SDL2_WINDOWS_URL_HASH\s+"SHA256=([0-9a-f]{64})"\)')" >> $env:GITHUB_OUTPUT
          "zlib_version=$(Lock 'set\(BUDO_ZLIB_SOURCE_VERSION "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "zlib_url=$(Lock 'set\(BUDO_ZLIB_SOURCE_URL "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "zlib_sha256=$(Lock 'set\(BUDO_ZLIB_SOURCE_SHA256 "([0-9a-f]{64})"\)')" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC (x64)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the x64 C++ tools was not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          # Export the developer environment to every following step. A batch
          # file avoids cmd.exe quote stripping on the path with spaces.
          $bat = "$env:RUNNER_TEMP\vcvars-env.bat"
          Set-Content -Path $bat -Value "@call `"$vcvars`" x64 >nul`r`n@set" -Encoding ASCII
          cmd /c $bat | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install Ninja and OpenSSL
        run: |
          choco install -y --no-progress ninja openssl
          $roots = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL")
          $openssl = $roots | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $openssl) { throw "OpenSSL headers not found after installation" }
          "OPENSSL_ROOT_DIR=$openssl" >> $env:GITHUB_ENV
          Write-Host "OpenSSL: $openssl"

      - name: Download pinned SDL2 ${{ steps.lock.outputs.sdl_version }}
        env:
          SDL_URL: ${{ steps.lock.outputs.sdl_url }}
          SDL_SHA256: ${{ steps.lock.outputs.sdl_sha256 }}
          SDL_VERSION: ${{ steps.lock.outputs.sdl_version }}
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2-dev.zip"
          Invoke-WebRequest -Uri $env:SDL_URL -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:SDL_SHA256) {
            throw "SDL2 archive SHA-256 mismatch (expected $env:SDL_SHA256, got $actual)"
          }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          "SDL2_ROOT=$env:RUNNER_TEMP\SDL2-$env:SDL_VERSION" >> $env:GITHUB_ENV

      - name: Download STB
        shell: bash
        run: ./scripts/setup-stb.sh

      # Windows has no system zlib: build the pinned source as a static library
      # (linked into budo.exe, so there is no zlib DLL to ship).
      - name: Build pinned zlib ${{ steps.lock.outputs.zlib_version }}
        env:
          ZLIB_URL: ${{ steps.lock.outputs.zlib_url }}
          ZLIB_SHA256: ${{ steps.lock.outputs.zlib_sha256 }}
          ZLIB_VERSION: ${{ steps.lock.outputs.zlib_version }}
        run: |
          $archive = "$env:RUNNER_TEMP\zlib.tar.gz"
          Invoke-WebRequest -Uri $env:ZLIB_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZLIB_SHA256) {
            throw "zlib archive SHA-256 mismatch (expected $env:ZLIB_SHA256, got $actual)"
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = "$env:RUNNER_TEMP\zlib-$env:ZLIB_VERSION"
          $prefix = "$env:RUNNER_TEMP\zlib-install"
          cmake -S $src -B "$src\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_INSTALL_PREFIX="$prefix" -DZLIB_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$src\build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install "$src\build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZLIB_ROOT=$prefix" >> $env:GITHUB_ENV

      # Building Skia takes most of the job, so the built tree is cached per
      # locked commit. Its checkout history, third-party sources, and object
      # files are not needed to build Budo and are left out of the cache.
      # (Saved right after building, so a later Budo build failure keeps it.)
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/skia
            !third_party/skia/.git
            !third_party/skia/third_party/externals
            !third_party/skia/out/Release/obj
          key: skia-windows-x64-${{ steps.lock.outputs.skia }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem Skia's synced dependencies come close to the 260-character path limit.
          git config --global core.longpaths true
          call scripts\setup-skia.bat

      - name: Save Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/skia
            !third_party/skia/.git
            !third_party/skia/third_party/externals
            !third_party/skia/out/Release/obj
          key: skia-windows-x64-${{ steps.lock.outputs.skia }}

      - name: Configure
        env:
          QUICKJS_IMPL: ${{ steps.lock.outputs.quickjs }}
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DSKIA_PATH="$PWD\third_party\skia" `
            -DSDL2_DIR="$env:SDL2_ROOT\cmake" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DZLIB_ROOT="$env:ZLIB_ROOT" `
            -DZLIB_USE_STATIC_LIBS=ON `
            -DENABLE_NEURAL=OFF `
            -DBUDO_QUICKJS_IMPL="$env:QUICKJS_IMPL" 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath build-configure.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # CMake keeps going after most errors and only says "Configuring
            # incomplete" at the end: repeat each error block here.
            $lines = Get-Content build-configure.log
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^CMake Error') {
                $block = @($lines[$i])
                for ($j = $i + 1; $j -lt $lines.Count -and $j -le $i + 25; $j++) {
                  if ($lines[$j] -match '^(--|CMake (Error|Warning))') { break }
                  $block += $lines[$j]
                }
                $text = ($block -join "%0A")
                Write-Host "::error title=CMake configure::$text"
              }
            }
            exit $code
          }

      - name: Build
        run: |
          cmake --build build --config Release --target budo -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $out = "dist\budo-windows-x86_64"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item build\budo.exe $out
          # DLLs CMake placed next to the exe, Wasmtime, SDL2, and OpenSSL.
          Get-ChildItem build -Filter *.dll | Copy-Item -Destination $out
          Get-ChildItem build\wasmtime\lib -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          Copy-Item "$env:SDL2_ROOT\lib\x64\SDL2.dll" $out
          $ssl = Get-ChildItem "$env:OPENSSL_ROOT_DIR\bin" -Filter *.dll |
            Where-Object { $_.Name -match '^(libssl|libcrypto)-.*\.dll$' }
          if (-not $ssl) { throw "OpenSSL runtime DLLs not found under $env:OPENSSL_ROOT_DIR\bin" }
          $ssl | Copy-Item -Destination $out
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $out
          # Budo uses the DLL C runtime (/MD): ship the redistributable MSVC
          # runtime app-locally so users need no VC++ Redistributable install.
          $redist = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|OpenMP)$' }
          if (-not ($redist | Where-Object Name -like '*.CRT')) {
            throw "MSVC redistributable runtime not found under $env:VCToolsRedistDir"
          }
          $redist | ForEach-Object { Get-ChildItem $_.FullName -Filter *.dll | Copy-Item -Destination $out }

          # Every DLL that budo.exe or a shipped DLL imports must be shipped or
          # come with Windows.
          $deps = Get-ChildItem $out -Include *.exe, *.dll -Recurse | ForEach-Object {
            dumpbin /nologo /dependents $_.FullName
          } | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[\w.+-]+\.dll$' } | Sort-Object -Unique
          # The MSVC runtime is in System32 on the runner but not on every user
          # machine, so it must be shipped.
          $missing = $deps | Where-Object {
            -not (Test-Path "$out\$_") -and (
              $_ -match '^(vcruntime|msvcp|concrt|vcomp)' -or
              (-not (Test-Path "$env:SystemRoot\System32\$_") -and $_ -notmatch '^(api|ext)-ms-'))
          }
          Write-Host "Imports: $($deps -join ', ')"
          if ($missing) { throw "Not shipped with budo.exe: $($missing -join ', ')" }

          & "$out\budo.exe" help > $null
          if ($LASTEXITCODE -ne 0) { throw "budo.exe help failed with exit code $LASTEXITCODE" }

          Compress-Archive -Path "$out\*" -DestinationPath "dist\budo-windows-x86_64.zip" -Force
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/budo-windows-x86_64.zip
          if-no-files-found: error
