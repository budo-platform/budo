name: Windows build

# Reusable Windows x64 release build (MSVC + Ninja); publishes one executable.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded artifact holding the executable"
        type: string
        default: budo-windows-x86_64

permissions:
  contents: read

jobs:
  build:
    name: Build budo-windows-x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@main

      - name: Read dependency lock
        id: lock
        run: |
          $lock = Get-Content cmake/BudoDependencyLock.cmake -Raw
          function Lock($pattern) {
            $value = [regex]::Match($lock, $pattern).Groups[1].Value
            if (-not $value) { throw "Dependency lock value not found: $pattern" }
            return $value
          }
          "skia=$(Lock 'set\(BUDO_SKIA_DESKTOP_GIT_TAG "([0-9a-f]{40})"\)')" >> $env:GITHUB_OUTPUT
          "quickjs=$(Lock 'set\(BUDO_QUICKJS_IMPL_DEFAULT "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_version=$(Lock 'set\(BUDO_SDL2_SOURCE_VERSION "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_url=$(Lock 'set\(BUDO_SDL2_SOURCE_URL "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "sdl_sha256=$(Lock 'set\(BUDO_SDL2_SOURCE_SHA256 "([0-9a-f]{64})"\)')" >> $env:GITHUB_OUTPUT
          "zlib_version=$(Lock 'set\(BUDO_ZLIB_SOURCE_VERSION "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "zlib_url=$(Lock 'set\(BUDO_ZLIB_SOURCE_URL "([^"]+)"\)')" >> $env:GITHUB_OUTPUT
          "zlib_sha256=$(Lock 'set\(BUDO_ZLIB_SOURCE_SHA256 "([0-9a-f]{64})"\)')" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC (x64)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the x64 C++ tools was not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          # Export the developer environment to every following step. A batch
          # file avoids cmd.exe quote stripping on the path with spaces.
          $bat = "$env:RUNNER_TEMP\vcvars-env.bat"
          Set-Content -Path $bat -Value "@call `"$vcvars`" x64 >nul`r`n@set" -Encoding ASCII
          cmd /c $bat | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install Ninja and static OpenSSL
        run: |
          choco install -y --no-progress ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = "$env:RUNNER_TEMP\vcpkg-installed"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static "--x-install-root=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_ROOT_DIR=$prefix\x64-windows-static" >> $env:GITHUB_ENV

      - name: Build pinned static SDL2 ${{ steps.lock.outputs.sdl_version }}
        env:
          SDL_URL: ${{ steps.lock.outputs.sdl_url }}
          SDL_SHA256: ${{ steps.lock.outputs.sdl_sha256 }}
          SDL_VERSION: ${{ steps.lock.outputs.sdl_version }}
        run: |
          $archive = "$env:RUNNER_TEMP\sdl2.tar.gz"
          Invoke-WebRequest -Uri $env:SDL_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SDL_SHA256) {
            throw "SDL2 archive SHA-256 mismatch (expected $env:SDL_SHA256, got $actual)"
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = "$env:RUNNER_TEMP\SDL2-$env:SDL_VERSION"
          $prefix = "$env:RUNNER_TEMP\sdl2-install"
          cmake -S $src -B "$src\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" -DSDL_SHARED=OFF -DSDL_STATIC=ON `
            -DSDL_FORCE_STATIC_VCRT=ON -DSDL_TEST=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$src\build" --target install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SDL2_ROOT=$prefix" >> $env:GITHUB_ENV

      - name: Download STB
        shell: bash
        run: ./scripts/setup-stb.sh

      # Windows has no system zlib: build the pinned source as a static library
      # (linked into budo.exe, so there is no zlib DLL to ship).
      - name: Build pinned zlib ${{ steps.lock.outputs.zlib_version }}
        env:
          ZLIB_URL: ${{ steps.lock.outputs.zlib_url }}
          ZLIB_SHA256: ${{ steps.lock.outputs.zlib_sha256 }}
          ZLIB_VERSION: ${{ steps.lock.outputs.zlib_version }}
        run: |
          $archive = "$env:RUNNER_TEMP\zlib.tar.gz"
          Invoke-WebRequest -Uri $env:ZLIB_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZLIB_SHA256) {
            throw "zlib archive SHA-256 mismatch (expected $env:ZLIB_SHA256, got $actual)"
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = "$env:RUNNER_TEMP\zlib-$env:ZLIB_VERSION"
          $prefix = "$env:RUNNER_TEMP\zlib-install"
          cmake -S $src -B "$src\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_INSTALL_PREFIX="$prefix" -DZLIB_BUILD_EXAMPLES=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$src\build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install "$src\build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZLIB_ROOT=$prefix" >> $env:GITHUB_ENV

      # Building Skia takes most of the job, so the built tree is cached per
      # locked commit and per version of scripts/setup-skia.bat (its GN args).
      # Its checkout history, third-party sources, and object files are not
      # needed to build Budo and are left out of the cache. (Saved right after
      # building, so a later Budo build failure keeps it.)
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/skia
            !third_party/skia/.git
            !third_party/skia/third_party/externals
            !third_party/skia/out/Release/obj
          key: skia-windows-x64-mt-${{ steps.lock.outputs.skia }}-${{ hashFiles('scripts/setup-skia.bat') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem Skia's synced dependencies come close to the 260-character path limit.
          git config --global core.longpaths true
          set BUDO_SKIA_MSVC_RUNTIME=/MT
          call scripts\setup-skia.bat

      - name: Save Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/skia
            !third_party/skia/.git
            !third_party/skia/third_party/externals
            !third_party/skia/out/Release/obj
          key: skia-windows-x64-mt-${{ steps.lock.outputs.skia }}-${{ hashFiles('scripts/setup-skia.bat') }}

      - name: Configure
        env:
          QUICKJS_IMPL: ${{ steps.lock.outputs.quickjs }}
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DSKIA_PATH="$PWD\third_party\skia" `
            -DCMAKE_PREFIX_PATH="$env:SDL2_ROOT" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DZLIB_ROOT="$env:ZLIB_ROOT" `
            -DZLIB_USE_STATIC_LIBS=ON `
            -DBUDO_WINDOWS_STANDALONE=ON `
            -DBUDO_GITHUB_REPOSITORY_OVERRIDE="${{ github.repository }}" `
            -DENABLE_ONNX=OFF `
            -DBUDO_QUICKJS_IMPL="$env:QUICKJS_IMPL" 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath build-configure.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # CMake keeps going after most errors and only says "Configuring
            # incomplete" at the end: repeat each error block here.
            $lines = Get-Content build-configure.log
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^CMake Error') {
                $block = @($lines[$i])
                for ($j = $i + 1; $j -lt $lines.Count -and $j -le $i + 25; $j++) {
                  if ($lines[$j] -match '^(--|CMake (Error|Warning))') { break }
                  $block += $lines[$j]
                }
                $text = ($block -join "%0A")
                Write-Host "::error title=CMake configure::$text"
              }
            }
            exit $code
          }

      - name: Build
        run: |
          # -k 0: keep compiling after a failure so one run reports every error.
          cmake --build build --config Release --target budo -j $env:NUMBER_OF_PROCESSORS -- -k 0 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath build-compile.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Repeat every failure at the end (and as annotations): with -k 0
            # the first errors are otherwise hundreds of lines up.
            $errors = Select-String -Path build-compile.log -Pattern '^FAILED: ', ': (fatal )?error [A-Z]+\d+', 'error LNK\d+', 'LINK : fatal error'
            Write-Host ""
            Write-Host "===== $($errors.Count) error line(s) ====="
            foreach ($e in $errors) {
              Write-Host $e.Line
              if ($e.Line -notmatch '^FAILED: ') { Write-Host "::error title=Windows build::$($e.Line)" }
            }
            exit $code
          }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = "dist\budo-windows-x86_64.exe"
          Copy-Item build\budo.exe $exe
          $imports = dumpbin /nologo /dependents $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deps = $imports | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -match '^[\w.+-]+\.dll$' } | Sort-Object -Unique
          $missing = $deps | Where-Object {
            $_ -match '^(vcruntime|msvcp|concrt|vcomp|sdl2|wasmtime|libcrypto|libssl|zlib)' -or
            (-not (Test-Path "$env:SystemRoot\System32\$_") -and $_ -notmatch '^(api|ext)-ms-')
          }
          Write-Host "Imports: $($deps -join ', ')"
          if ($missing) { throw "Not shipped with budo.exe: $($missing -join ', ')" }

          python tests/desktop_package_test.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/budo-windows-x86_64.exe
          if-no-files-found: error
